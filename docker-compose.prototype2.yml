# Isolated PostgreSQL 16 for local Prototype 2 review. No production credentials.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: llm_harness_p2_review
      POSTGRES_USER: llm_harness
      POSTGRES_PASSWORD: local-p2-review-only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - p2-review-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llm_harness -d llm_harness_p2_review"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  p2-review-data:
