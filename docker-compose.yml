services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: llm_harness
      POSTGRES_USER: llm_harness
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llm_harness -d llm_harness"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
